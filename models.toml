# US, sorti le 2026-06-09 ; second modèle frontière du panel
# L'effort de raisonnement fait partie de l'identité du candidat, au même titre
# que la route. Comparer un modèle à effort maximal contre un autre à son effort
# par défaut mesure aussi les réglages. Un alias par triplet modèle, route et
# effort ; jamais d'effort implicite sur un modèle qui expose ce paramètre
[fable-5-high]
model = "anthropic/claude-fable-5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "high"

[fable-5-medium]
model = "anthropic/claude-fable-5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "medium"

[fable-5-xhigh]
model = "anthropic/claude-fable-5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "xhigh"

[grok-4-5-high]
model = "x-ai/grok-4.5"
provider = "xai"
reasoning_effort = "high"

# Opus 5, ajouté le 2026-08-05 pour compléter la couverture Anthropic
[opus-5-high]
model = "anthropic/claude-opus-5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "high"

[opus-5-xhigh]
model = "anthropic/claude-opus-5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "xhigh"

# Panel élargi le 2026-08-05. Les quatre petits modèles sortent du panel général :
# ils seront testés sur des cartes dédiées à leur catégorie de poids
[mistral-medium-3-5]
model = "mistralai/mistral-medium-3-5"
provider = "mistral"

# Les quatre suivants : provider épinglé sur le fournisseur de premier rang du
# modèle, et `seed` omis parce que leurs endpoints ne l'exposent pas
[mimo-v2-5]
model = "xiaomi/mimo-v2.5"
provider = "xiaomi"
omit_params = ["seed"]

[minimax-m3]
model = "minimax/minimax-m3"
provider = "minimax"
omit_params = ["seed"]

# Route de premier rang DeepSeek, refusée sous le régime `retenu` : elle
# s'entraîne sur les données des requêtes. Accessible sous `--regime expose`,
# le seul régime des cartes déjà publiques (R-005 scindée le 2026-08-05)
[deepseek-v4-pro]
model = "deepseek/deepseek-v4-pro"
provider = "deepseek"
omit_params = ["seed"]

# Route : GMICloud depuis le 2026-08-06, sur critère `selection-route/v2`.
# Seul cas du panel où une route en pleine précision existe réellement : elle
# déclare `bf16` là où l'éditeur lui-même sert en `fp8`. Elle gagne aussi sur
# les deux autres axes, 253 952 jetons de complétion contre 128 000, et elle
# accepte tout le contrat d'échantillonnage quand `tencent` refusait `top_p`
# et `seed`. Le seul point où elle perd est de ne pas être l'éditeur, ce que
# le critère place après la précision, précisément pour ce cas
[hy3]
model = "tencent/hy3"
provider = "gmicloud"

# Kimi K3 sur routes alternatives, ajoutées le 2026-08-05. La route Morph rend
# 429 « temporarily rate-limited upstream » sur douze tentatives consécutives.
# Sous R-003 et R-004 une route différente est un candidat différent : ces
# alias ne se comparent pas à `kimi-k3` sur Morph, ils s'ajoutent au tableau

# BaseTen impose top_p : « Cannot override enforced sampling params »

# Sonde d'effort, 2026-08-05. `default` consomme environ 2833 jetons de
# raisonnement contre 8650 en `high` : GPT 5.6-sol raisonne donc toujours, même
# sans paramètre. Ces alias servent à identifier quelle valeur nommée
# correspond au défaut, en comparant la consommation sur la même carte

# Kimi K3 expose reasoning_effort. Vérifier si `max` est accepté et distinct

# Kimi K3, 2026-08-05. Le candidat sans effort déclaré est retiré : son défaut
# a consommé 23 207 puis 43 422 jetons de raisonnement sur deux runs identiques.
# Un effort qui varie du simple au double n'est pas un candidat, c'est un tirage
#
# Route : Wafer depuis le 2026-08-06, sur critère `selection-route/v2`.
# Modal avait été retenue pour son débit, sans voir qu'elle sert le modèle en
# `mxfp4`, une quantification sur quatre bits : le débit ne compte pas ici, la
# précision des poids si. Wafer déclare `fp8` et accepte tous les paramètres du
# contrat, seed compris. Aucune route non quantifiée n'existe pour ce modèle,
# `moonshotai` sert lui-même en `mxfp4` : `fp8` est le mieux disponible et
# l'écart au modèle de référence est assumé, pas ignoré.
# Les douze 429 de Morph du 2026-08-05 n'étaient pas une route morte : le reçu
# annonçait `retry_after_seconds: 2` sur un pool partagé, et le lanceur a
# renvoyé les trois tentatives en quelques secondes. Corrigé le 2026-08-06
#
# Un seul alias, `max`. `kimi-k3-high` a été retiré le 2026-08-06 : sa collecte
# n'a abouti que sur deux runs sur quatre là où `max` en a complété quatre, sur
# la même route et au même moment. Le motif du retrait est le rythme que ce
# fournisseur impose, pas un résultat observé : aucun des deux alias n'était
# noté au moment de la décision (R-013a)
[kimi-k3-max]
model = "moonshotai/kimi-k3"
provider = "wafer"
reasoning_effort = "max"

# --- Muse Spark 1.2, ajouté le 2026-08-06 ---
# Sondé avant ajout, comme l'exige la discipline sur les niveaux de raisonnement.
# Contrairement à la présomption de départ, ce modèle EXPOSE des niveaux : les
# sept valeurs essayées sont toutes acceptées.
#
#   effort      jetons de raisonnement (3 tirages)
#   (aucun)     2787  3335  3511
#   minimal     1106  1251  1400
#   low         1690  1979  2174
#   medium      2093  2378  2899
#   high        2849  2891  3670
#   xhigh       3583  3715  3836
#   max         2817  3343  3413
#
# Un seul niveau retenu, `max`. On mesure le haut de gamme de chaque modèle,
# pas son échelle complète : ouvrir `minimal` et `low` ici obligerait à les
# ouvrir chez OpenAI et Anthropic, et le panel deviendrait ingérable.
#
# Le choix de `max` plutôt que `high` évite au passage un problème non résolu :
# sur trois tirages, les plages de `high`, `xhigh` et `max` se recouvrent, et
# rien ne prouvait qu'ils soient des candidats distincts au sens de R-003. Une
# seconde sonde à six tirages a été coupée par un 429 du fournisseur. Avec un
# seul alias, la question ne se pose plus.
#
# Route : `meta`, seule route existante, celle de l'éditeur, précision non
# déclarée, 1 040 384 jetons de complétion. Elle refuse `seed`.

[muse-spark-1-2-max]
model = "meta/muse-spark-1.2"
provider = "meta"
omit_params = ["seed"]
reasoning_effort = "max"
