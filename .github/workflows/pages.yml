name: Publier le site GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer uniquement le site public
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pages
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Vérifier l’arbre public
        shell: bash
        run: |
          set -euo pipefail
          test -f pages/index.html

          if find pages -type l -print -quit | grep -q .; then
            echo "Lien symbolique interdit dans pages/" >&2
            exit 1
          fi

          fichiers_interdits="$(find pages -type f ! -name '*.html' ! -name '*.css' -print)"
          if [[ -n "${fichiers_interdits}" ]]; then
            printf 'Fichiers interdits dans pages/:\n%s\n' "${fichiers_interdits}" >&2
            exit 1
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer l’artefact public
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
