# Configuration locale non officielle de démonstration du harnais XS-04.
# Hors panel officiel : elle n'exécute aucun modèle, n'utilise aucun réseau,
# aucun compte et aucun quota réel. Tout champ non observé reste littéralement INCONNU.
schema_version = "campagne-v1-configuration-abonnement/v1"
configuration_id = "local-system-wc"

[produit]
nom = "utilitaire système wc"
editeur = "INCONNU"

[plan]
nom = "INCONNU"
prix_montant = "INCONNU"
prix_devise = "INCONNU"
periode = "INCONNU"
source_url = "INCONNU"
date_publication = "INCONNU"
date_consultation = "INCONNU"

[[quota]]
unite = "INCONNU"
valeur = "INCONNU"
portee = "INCONNU"
reset_fenetre = "INCONNU"
reset_ancrage = "INCONNU"
reset_au_depassement = "INCONNU"

[interface]
type = "cli"
version = "INCONNU"

[modele]
demande = "INCONNU"

[harnais]
argv = ["/usr/bin/wc", "-c"]
stdin_fichier = "__PROMPT_FILE__"
espace_de_travail = "__ISOLATED_WORKSPACE__"
delai_secondes = 30

[intervention_humaine]
etapes = ["aucune : démonstration locale sans compte ni authentification"]
